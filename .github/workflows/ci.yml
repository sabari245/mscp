name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            image: ""
          - name: ubuntu-22.04
            image: ""
          - name: archlinux
            image: archlinux:base
    container: ${{ matrix.image && matrix.image || null }}

    steps:
      # The arch container lacks git, install it before checkout.
      - name: Install git (arch container)
        if: matrix.image == 'archlinux:base'
        run: |
          pacman -Syu --noconfirm git patch
          pacman -S --noconfirm --needed gcc make cmake

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies (ubuntu)
        if: runner.os == 'Linux' && matrix.image == ''
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc make cmake zlib1g-dev libssl-dev libkrb5-dev patch

      - name: Install build dependencies (arch)
        if: matrix.image == 'archlinux:base'
        run: pacman -S --noconfirm --needed zlib openssl

      - name: Apply libssh async-write patch
        run: |
          git -C libssh fetch --all --tags --prune
          desc=$(git -C libssh describe --tags)
          echo "Applying patch/${desc}.patch"
          test -f "patch/${desc}.patch"
          patch -d libssh -p1 < "patch/${desc}.patch"

      - name: Build
        run: |
          mkdir -p build && cd build
          cmake ..
          make -j"$(nproc)"

      - name: Smoke test (usage)
        run: ./build/mscp -h >/dev/null && echo "mscp -h OK"

      # Regression test for ssh_config default support: an alias defined
      # in ~/.ssh/config must resolve without -F. mscp should fail with
      # "Connection refused" (alias resolved to 127.0.0.1:2222) instead
      # of a DNS resolution failure.
      - name: Smoke test (ssh_config default)
        shell: bash
        run: |
          # libssh resolves the home directory via getpwuid, which in
          # GitHub container jobs (/root) differs from $HOME
          # (/github/home). Write the config to the passwd home.
          home=$(getent passwd "$(id -u)" | cut -d: -f6)
          mkdir -p "$home/.ssh"
          cat > "$home/.ssh/config" <<'EOF'
          Host mscpci-alias
            Hostname 127.0.0.1
            Port 2222
          EOF
          out=$(./build/mscp mscpci-alias:/tmp/x /tmp/y 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -q "Failed to resolve"; then
            echo "::error::ssh_config (~/.ssh/config) was not applied by default"
            exit 1
          fi
          echo "$out" | grep -q "Connection refused" \
            || { echo "::error::unexpected failure, alias may not have resolved"; exit 1; }
          echo "ssh_config default support OK"

      - name: Smoke test (-F explicit config)
        shell: bash
        run: |
          cfg=$(mktemp)
          printf 'Host mscpci-falias\n  Hostname 127.0.0.1\n  Port 2223\n' > "$cfg"
          out=$(./build/mscp -F "$cfg" mscpci-falias:/tmp/x /tmp/y 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Connection refused" || { echo "::error::-F did not apply"; exit 1; }
          echo "-F explicit config OK"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mscp-${{ matrix.name }}-x86_64
          path: |
            build/mscp
            build/mscp.1
          if-no-files-found: error
