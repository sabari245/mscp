name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest supported Ubuntu (glibc 2.35) so the single
          # glibc artifact runs on Ubuntu 22.04+, Debian 12+ and other
          # glibc >= 2.35 systems.
          - name: linux-glibc
            runner: ubuntu-22.04
            image: ""
          - name: arch
            runner: ubuntu-latest
            image: archlinux:base
    container: ${{ matrix.image && matrix.image || null }}

    steps:
      - name: Install git (arch container)
        if: matrix.image == 'archlinux:base'
        run: |
          pacman -Syu --noconfirm git patch
          pacman -S --noconfirm --needed gcc make cmake

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies (ubuntu)
        if: runner.os == 'Linux' && matrix.image == ''
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc make cmake zlib1g-dev libssl-dev libkrb5-dev patch

      - name: Install build dependencies (arch)
        if: matrix.image == 'archlinux:base'
        run: pacman -S --noconfirm --needed zlib openssl

      - name: Apply libssh async-write patch
        run: |
          git -C libssh fetch --all --tags --prune
          desc=$(git -C libssh describe --tags)
          test -f "patch/${desc}.patch"
          patch -d libssh -p1 < "patch/${desc}.patch"

      - name: Build
        run: |
          mkdir -p build && cd build
          cmake ..
          make -j"$(nproc)"

      - name: Package
        id: pkg
        env:
          MSCP_VERSION: ${{ github.ref_name }}
        run: |
          tag="${MSCP_VERSION#v}"
          platform="${{ matrix.name }}"
          dir="mscp-${tag}-${platform}-x86_64"
          mkdir -p "$dir"
          install -m 0755 build/mscp "$dir/mscp"
          test -f build/mscp.1 && install -m 0644 build/mscp.1 "$dir/mscp.1"
          {
            echo "mscp ${MSCP_VERSION} (${platform}, x86_64)"
            echo "Install: sudo install -m755 mscp /usr/local/bin/"
            echo "         sudo install -m644 mscp.1 /usr/local/share/man/man1/"
          } > "$dir/README.txt"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          echo "asset=$dir.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}-x86_64
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "mscp ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
